<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>🎆 Chúc Mừng Năm Mới 2026 🎆</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(180deg, #020111, #191970, #000);
    font-family: 'Montserrat', sans-serif;
    color: #fff;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
}

.container {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 4.5rem;
    color: gold;
    text-shadow: 0 0 20px gold, 0 0 40px red;
    animation: float 3s ease-in-out infinite;
}

.year {
    font-size: 5rem;
    font-weight: 600;
    color: #ff5252;
    margin: 10px 0;
    animation: glow 2s infinite alternate;
}

p {
    font-size: 1.4rem;
    color: #ffeb3b;
    margin-top: 10px;
}

.signature {
    margin-top: 30px;
    font-size: 1.1rem;
    opacity: 0.85;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ff5252; }
    to { text-shadow: 0 0 30px gold, 0 0 60px red; }
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">
    <h1>🎉 Chúc Mừng Năm Mới 🎉</h1>
    <div class="year">2026</div>
    <p>✨ An Khang – Thịnh Vượng – Vạn Sự Như Ý ✨</p>
    <div class="signature">💖 Chúc bạn một năm tràn đầy may mắn</div>
</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

class Firework {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height;
        this.targetY = Math.random() * canvas.height / 2;
        this.color = `hsl(${Math.random() * 360},100%,60%)`;
        this.exploded = false;
        this.particles = [];
    }

    update() {
        if (!this.exploded) {
            this.y -= 6;
            if (this.y <= this.targetY) {
                this.explode();
                this.exploded = true;
            }
        }
        this.particles.forEach(p => p.update());
    }

    draw() {
        if (!this.exploded) {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        this.particles.forEach(p => p.draw());
    }

    explode() {
        for (let i = 0; i < 70; i++) {
            this.particles.push(new Particle(this.x, this.y, this.color));
        }
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.speedX = (Math.random() - 0.5) * 8;
        this.speedY = (Math.random() - 0.5) * 8;
        this.life = 120;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life--;
    }

    draw() {
        if (this.life > 0) {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

let fireworks = [];

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (Math.random() < 0.06) fireworks.push(new Firework());
    fireworks.forEach(f => {
        f.update();
        f.draw();
    });
    fireworks = fireworks.filter(f => f.particles.some(p => p.life > 0));
    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
